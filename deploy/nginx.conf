server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is a static document that talks to one API and loads no plugins.
    # These cost nothing here and remove whole categories of injected content.
    #
    # Repeated in every location below that sets a header of its own, because
    # nginx's add_header replaces rather than merges: a location with one
    # add_header directive silently discards every header inherited from here,
    # and the pages that lost them would be the ones a browser caches longest.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Backend proxy -----------------------------------------------------
    # The Go API lives in the same Pod on :8080. The browser talks only to this
    # origin, so nginx forwards every backend path to it. These are exact/longer
    # prefixes, so they match before the fallback `location /` below (nginx picks
    # the longest matching prefix).
    #
    # X-Forwarded-For is appended, not replaced: Traefik has already set it, and
    # the backend's TRUSTED_PROXIES list tells its rate limiter to read the first
    # untrusted hop. We just add the client address Traefik sees from us.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sub/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static files ------------------------------------------------------
    # The app routes in the browser: /editor and /editor/:id are real addresses
    # that no file on disk answers, so this fallback is what makes a bookmarked,
    # shared, or reloaded editor URL load the app instead of a 404 that looks
    # like the deploy is broken. It also catches GitHub's redirect back, which
    # lands on whatever VITE_OAUTH_REDIRECT_URI names.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames with a content hash, so a given URL can
    # never change what it returns and may be cached for as long as the browser
    # likes.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is the one file whose name stays the same across deploys. Cached,
    # it would keep pointing browsers at the previous build's asset hashes — files
    # that are no longer in the image — and the app would fail to load for exactly
    # the users who visit most often.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}