socks-port: 7891
mixed-port: 7890
mode: rule
allow-lan: false
log-level: info
ipv6: false
find-process-mode: 'off'
tcp-concurrent: true
hosts:
  '*.mihomo.dev': 127.0.0.1
  home.lan: lan
  baidu.com: google.com
ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
  write-to-system: true
profile:
  store-selected: true
experimental:
  dialer-ip4p-convert: true
authentication:
  - user1:pass1
skip-auth-prefixes:
  - 127.0.0.1/8
  - '::1/128'
lan-allowed-ips:
  - 0.0.0.0/0
  - '::/0'
lan-disallowed-ips:
  - 192.168.0.3/32
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://example.com/geoip.dat
