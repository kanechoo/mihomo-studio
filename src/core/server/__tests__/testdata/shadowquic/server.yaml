servers:
  - example.com
listeners:
  - name: shadowquic-node
    type: shadowquic
    port: 10822
    listen: 0.0.0.0
    users:
      - username: sq-user-1
        password: sq-password-1
      - username: sq-user-2
        password: sq-password-2
    jls-upstream:
      addr: www.example.com:443
    alpn:
      - h3
    quic-versions:
      - v1
    zero-rtt: false
    congestion-controller: cubic
    up: 100 Mbps
    down: 100 Mbps
    ignore-client-bandwidth: false
    cwnd: 32
    bbr-profile: standard
    max-idle-time: 30000
    max-datagram-frame-size: 1400
    recv-window-conn: 0
    recv-window: 0
    disable-mtu-discovery: false
