servers:
  - example.com
listeners:
  - name: sudoku-node
    type: sudoku
    port: 8443
    listen: 0.0.0.0
    key: 6f8a2b1c-4d5e-4f6a-8b7c-9d0e1f2a3b4c
    aead-method: chacha20-poly1305
    padding-min: 1
    padding-max: 15
    table-type: prefer_ascii
    custom-tables:
      - xpxvvpvv
      - vxpvxvvp
    handshake-timeout: 5
    enable-pure-downlink: false
    httpmask:
      disable: false
      mode: legacy
      path-root: ""
    fallback: "127.0.0.1:80"
